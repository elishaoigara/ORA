services:
  - type: web
    name: ora-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-mini.txt
    startCommand: uvicorn next_api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ORA_API_TOKEN
        sync: false
      - key: ORA_CRON_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Optional Groq credential for voice and image analysis only.
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional WhatsApp owner notifications (requires the WA sidecar service).
      # Points at the ora-whatsapp sidecar service below.
      - key: WA_SIDECAR_URL
        sync: false
      - key: WA_API_SECRET
        sync: false
      # Destination for proactive WhatsApp notifications: phone with country code or contact name.
      - key: ORA_WA_NOTIFY_NUMBER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: ORA_DAILY_AI_REQUESTS
        value: "100"


  - type: web
    name: ora-whatsapp
    runtime: node
    plan: free
    rootDir: whatsapp-sidecar
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      # Must match the backend's WA_API_SECRET; the sidecar refuses weak or default values.
      - key: WA_API_SECRET
        sync: false
      # Enables the inbound webhook back into the backend (X-ORA-Token).
      - key: ORA_BACKEND_URL
        sync: false
      - key: ORA_INTERNAL_TOKEN
        sync: false
      # Optional: restores a linked session after a redeploy on an ephemeral disk.
      - key: WA_SESSION_B64
        sync: false
      # Set to /data only when a persistent disk is mounted there.
