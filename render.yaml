# ORA on Render Free.
#
# Budget reality (Render Free = 750 instance hours per WORKSPACE per month):
#   * one always-running web service .......... ~730 h/month (all of it)
#   * the backend + the WhatsApp sidecar ...... ~1460 h/month (over budget)
#   * a 30-minute scheduler tick ............... ~360 h/month (half the clock)
#
# So this blueprint intentionally deploys ONE free service. The WhatsApp sidecar
# lives in its own blueprint (whatsapp-sidecar/render.yaml) and is meant for a paid
# instance; adding it to this file spends the whole monthly allowance twice over.
# See docs/RENDER_FREE_BUDGET.md before adding services, keep-alive pings or
# sub-15-minute cron schedules.
services:
  - type: web
    name: ora-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-mini.txt
    # One worker keeps inference concurrency bounded. The concurrency cap protects
    # the 512 MB free instance, and the short keep-alive releases idle sockets.
    startCommand: uvicorn next_api:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32 --timeout-keep-alive 5
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: ORA_FREE_TIER
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ORA_API_TOKEN
        sync: false
      - key: ORA_CRON_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      # Optional Groq credential for voice and image analysis only.
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional WhatsApp owner notifications. Only set these when the paid
      # sidecar in whatsapp-sidecar/render.yaml is deployed and awake.
      - key: WA_SIDECAR_URL
        sync: false
      - key: WA_API_SECRET
        sync: false
      # Destination for proactive WhatsApp notifications: phone with country code or contact name.
      - key: ORA_WA_NOTIFY_NUMBER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ORA_DAILY_AI_REQUESTS
        value: "100"
