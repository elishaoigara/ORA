services:
  # --- BACKEND ---
  - type: web
    name: ora-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT

    disk:
      name: ora-data
      mountPath: /opt/ora-data
      sizeGB: 1

    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ORA_LOOP_INTERVAL
        value: "30"
      - key: FRONTEND_URL
        sync: false
      - key: ORA_DATA_DIR
        value: /opt/ora-data
      # Render injects this automatically, but declaring it here makes it
      # explicit and ensures it is visible during the lifespan startup phase.
      # NOTE: The keep-alive self-ping was removed from api.py because Render
      # does NOT count loopback/internal requests as external activity.
      # Use an external uptime monitor (UptimeRobot / cron-job.org) to ping
      # /api/health every 14 minutes to prevent free-tier spin-down.
      - key: RENDER_EXTERNAL_URL
        sync: false

  # --- FRONTEND ---
  - type: web
    name: ora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false