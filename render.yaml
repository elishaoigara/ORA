services:
  # ─────────────────────────────────────────────
  # BACKEND
  # ─────────────────────────────────────────────
  - type: web
    name: ora-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT

    disk:
      name: ora-data
      mountPath: /opt/ora-data
      sizeGB: 1

    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ORA_LOOP_INTERVAL
        value: "30"
      - key: FRONTEND_URL
        sync: false
      - key: ORA_DATA_DIR
        value: /opt/ora-data
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: GROQ_MODEL_PRIMARY
        value: "llama-3.3-70b-versatile"
      - key: GROQ_MODEL_FALLBACK
        value: "llama-3.1-8b-instant"

  # ─────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────
  - type: web
    name: ora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

    envVars:
      - key: VITE_API_URL
        sync: false
