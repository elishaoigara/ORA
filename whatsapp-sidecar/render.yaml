# OPTIONAL standalone WhatsApp sidecar — for a paid plan only.
#
# The default deployment does NOT use this file. Render Free gives 750 instance
# hours to the whole workspace, and a bridge that stays connected uses ~730 of them
# on its own, so a second free service suspends the backend. The root Dockerfile
# therefore embeds the bridge inside the backend service (WA_EMBEDDED=1).
#
# Deploy this blueprint only when you want WhatsApp live 24/7 regardless of
# whether ORA is awake, i.e. on plan: starter. Point the backend at it with
# WA_SIDECAR_URL and leave WA_EMBEDDED unset.
#
# Deploy: Render Dashboard -> New -> Blueprint -> point at this directory.
services:
  - type: web
    name: ora-whatsapp
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      # Must match the backend's WA_API_SECRET; the sidecar refuses weak or default values.
      - key: WA_API_SECRET
        sync: false
      # Enables the inbound webhook back into the backend (X-ORA-Token).
      - key: ORA_BACKEND_URL
        sync: false
      - key: ORA_INTERNAL_TOKEN
        sync: false
      # Optional: restores a linked session after a redeploy on an ephemeral disk.
      - key: WA_SESSION_B64
        sync: false
      # Set to /data only when a persistent disk is mounted there.
